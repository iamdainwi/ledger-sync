version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ledgersync_postgres
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledgerpass
      POSTGRES_DB: bank_reconciliation
    volumes:
      - ledgersync_pgdata:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d bank_reconciliation"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ledgersync_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://ledger:ledgerpass@postgres:5432/bank_reconciliation
      UPLOAD_DIR: /app/data/input
      OUTPUT_DIR: /app/data/output
    volumes:
      - ledgersync_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ledgersync_frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  ledgersync_pgdata:
    driver: local
  ledgersync_data:
    driver: local

